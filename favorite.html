<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Favorite Person ❤️</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .favorite-section {
            min-height: 100vh;
            padding: 50px 20px;
            text-align: center;
        }

        .favorite-title {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .favorite-subtitle {
            font-size: 18px;
            margin-bottom: 35px;
            opacity: 0.8;
        }

        .favorite-gallery {
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .favorite-card {
            overflow: hidden;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            background: white;
        }

        .favorite-card img {
            width: 100%;
            height: 300px;
            display: block;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .favorite-card:hover img {
            transform: scale(1.05);
        }

        .back-button {
            display: inline-block;
            margin-top: 40px;
            padding: 13px 25px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            background: #ffffff;
            color: #333;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        @media (max-width: 768px) {

            .favorite-gallery {
                grid-template-columns: repeat(2, 1fr);
            }

            .favorite-card img {
                height: 250px;
            }

        }

        @media (max-width: 500px) {

            .favorite-gallery {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <section class="favorite-section">


        <h1 class="favorite-title">
            ❤️ My Favorite Person ❤️
        </h1>


        <p class="favorite-subtitle">
            Some people are memories... some people become memories. ✨
        </p>


        <div class="favorite-gallery">


            <div class="favorite-card">
                <img src="images/fav1.jpeg" alt="Favorite Memory 1">
            </div>

        <a href="memories.html" class="back-button">

</body>

</html>
