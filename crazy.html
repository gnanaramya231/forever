<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Crazy Things 🤪❤️</title>

    <link rel="stylesheet" href="style.css">


    <style>

        .crazy-section {

            min-height: 100vh;

            padding: 50px 20px;

            text-align: center;

        }


        .crazy-title {

            font-size: 38px;

            margin-bottom: 10px;

        }


        .crazy-subtitle {

            font-size: 18px;

            margin-bottom: 40px;

            opacity: 0.8;

        }


        .crazy-heading {

            font-size: 28px;

            margin: 35px 0 25px;

        }


        .crazy-gallery {

            max-width: 1100px;

            margin: auto;

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 22px;

        }


        .crazy-card {

            overflow: hidden;

            border-radius: 18px;

            background: white;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.15);

        }


        .crazy-card img {

            width: 100%;

            height: 300px;

            display: block;

            object-fit: cover;

            transition: transform 0.4s ease;

        }


        .crazy-card:hover img {

            transform: scale(1.05);

        }


        .crazy-video {

            width: 100%;

            height: 300px;

            display: block;

            object-fit: cover;

            border-radius: 18px;

        }


        .back-button {

            display: inline-block;

            margin-top: 45px;

            padding: 13px 25px;

            border-radius: 25px;

            text-decoration: none;

            font-weight: bold;

            background: #ffffff;

            color: #333;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.15);

        }


        @media (max-width: 768px) {

            .crazy-gallery {

                grid-template-columns: repeat(2, 1fr);

            }


            .crazy-card img,
            .crazy-video {

                height: 250px;

            }

        }


        @media (max-width: 500px) {

            .crazy-gallery {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>
